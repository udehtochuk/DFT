[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dft-spectral-energy-study"
version = "1.0.0"
description = "Retained spectral energy is not reconstruction fidelity: verified re-analysis of DFT coefficient selection"
readme = "../documentation/README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Udeh Tochukwu L."}]
keywords = ["discrete Fourier transform", "Parseval", "energy compaction",
            "coefficient selection", "signal reconstruction", "reproducibility"]
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "pandas>=2.0",
  "tabulate>=0.9", "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "python-docx>=1.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.dft_study]
master_seed = 20260826
dft_convention = "unitary: X[k] = (1/sqrt(N)) sum x[n] exp(-j2*pi*k*n/N)"
